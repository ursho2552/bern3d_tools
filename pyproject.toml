[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bern3d-tools"
version = "0.1.0"
description = "Tools for Bern3D model optimization and analysis"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "xarray",
    "scikit-optimize",
    "pyyaml",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["bern3d_tools*"]