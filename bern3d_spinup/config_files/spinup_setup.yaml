# Path to the script template
bern3d_template: "/storage/homefs/uh24x373/bgc_bern/optimize_wind_velocity/spinup/bern3d_f90/run"
# Should contain the name of the executable and the path to the executable
bern3d_executable_name: "RUNNAME"
bern3d_restart_files: !!python/none

# Path to the work directory (should be in $SCRATCH)
work_directory: "/storage/scratch/users/uh24x373/sensitivity_analysis"
# Path of the sbatch scripts (should be in the bern3d_tools)
sbatch_script:
  phase1: "../shared/runscripts/run_bern3d_f90_mpi_3het.sh"
  phase2: "../shared/runscripts/run_bern3d_f90_mpi_3het.sh"
  phase3: "../shared/runscripts/run_bern3d_f90_mpi_4het.sh"

# Time to run the script
time: "06:00:00"

# Spinup phases to run
# 1: spinup phase 1
# 2: spinup phase 1 & 2
# 3: spinup phase 1, 2 & 3
spinup_phases: 3
current_phase: 1
