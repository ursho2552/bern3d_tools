# Path to the bern3D executable without the name
bern3d_template: "/storage/scratch/users/uh24x373/Particle_flux/run"
# Name of the executable
bern3d_executable_name: "Spinup3"
# Name of parameter file containing parameters to change
bern3d_parameter_file: ".bgc.parameter"
# Path to restart files:
bern3d_restart_files: "/storage/scratch/users/uh24x373/Particle_flux/results/Spinup2*"
# List of parameters to change with the following options:
# 1. A single value (e.g. 0.1) will use it as a factor to multiply the standard value by 1 +/- value
# 2. A list of values (e.g. [0.1, 0.2, 0.3]) will use these values as absolute values for the parameter
# 3. A null value (e.g. !!python/none) will use the standard value for the parameter
# 4. A dictionary of lists (e.g. {param1: [0.1, 0.2], param2: [0.3, 0.4]}) will use these values as absolute values for the parameters listed
parameter_list:
  ligtot: 0.1
  ligstab: !!python/none
  freefemax: 0.4
  kscavcons: [0.7, 0.4]
  fesed:
    ligtot: [0.1, 0.2, 0.3]
    freefemax: [0.4, 0.5, 0.6]
    fesed: [0.7, 0.8, 0.9]

# Relative change to standard (e.g. 25% increase and decrease is given as 0.25)
relative_change: 0.25

# Target field
target_field:
   Fe: ".00001765_full_ave.nc"

# Work directory
work_directory: "/storage/scratch/users/uh24x373/Test_multiparam/"
# Path to the sbatch script
bern3d_run_script: "/storage/homefs/uh24x373/bgc_bern/bern3d_tools/shared/runscripts/run_bern3d_f90_mpi_4het.sh"
evaluation_script: "/storage/homefs/uh24x373/bgc_bern/bern3d_tools/bern3d_sensitivity/runscripts/run_evaluation.sh"
main_script_path: "/storage/homefs/uh24x373/bgc_bern/bern3d_tools/bern3d_sensitivity/"
# Time
time_bern3d: "10:00:00"
time_evaluation: "01:00:00"
