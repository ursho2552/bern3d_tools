# Path to the bern3D executable without the name
bern3d_template: "/storage/homefs/uh24x373/bgc_bern/debug_Bern3D/bern3d_f90/run"
# Name of the executable
bern3d_executable_name: "RUNNAME"
# Name of parameter file containing parameters to change
bern3d_parameter_file: ".bgc.parameter"
# Path to restart files:
bern3d_restart_files: "/storage/homefs/uh24x373/bgc_bern/debug_Bern3D/bern3d_f90/results/Spinup2*"
# List of parameters to change
parameter_list: >
  ligtot, ligstab, freefemax, kscavcons, fesed, sedlim, fesol,
  ffedust, ffehydro, LigMin, ligREM, ligDOC, fefrac, fesedmax,
  febucketinit, FeSigPOC, FeSigIno, FeSigAuth,
  bgcaggpar, coxf
# Relative change to standard (e.g. 25% increase and decrease is given as 0.25)
relative_change: 0.25

# Target field
target_field:
   Fe: ".00001765_full_ave.nc"

# Work directory
work_directory: "/storage/scratch/users/uh24x373/sensitivity_Fe/"
# Path to the sbatch script
bern3d_run_script: "/storage/homefs/uh24x373/bgc_bern/bern3d_tools/bern3d_sensitivity/runscripts/run_bern3d_f90_sequential.sh"
evaluation_script: "/storage/homefs/uh24x373/bgc_bern/bern3d_tools/bern3d_sensitivity/runscripts/run_evaluation.sh"
main_script_path: "/storage/homefs/uh24x373/bgc_bern/bern3d_tools/bern3d_sensitivity/"
# Time
time_bern3d: "10:00:00"
time_evaluation: "01:00:00"
